# Production: one VPS. `cp .env.prod.example .env.prod`, fill it in, then
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: course_sale  # fixed, so container and volume names do not depend on the folder name

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invonics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: invonics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invonics -d invonics"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: only reachable on the compose network.

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://invonics:${POSTGRES_PASSWORD}@db:5432/invonics
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # A database dump and a storage archive every night, kept for BACKUP_KEEP_DAYS days on the backups volume.
  # That volume lives on the same server as the data, so it protects against a bad deploy or a deleted
  # row and not against losing the server: copy it elsewhere (see README, "Back up").
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      POSTGRES_DB: invonics
      POSTGRES_USER: invonics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - storage:/storage:ro
      - backups:/backups

volumes:
  pgdata:
  storage:
  backups:
  caddy_data:
  caddy_config:
