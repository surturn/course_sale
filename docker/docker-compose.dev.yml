services:
  db:
    image: postgres:16-alpine
    container_name: invonics_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: invonics
      POSTGRES_PASSWORD: invonics_dev_pass
      POSTGRES_DB: invonics_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invonics -d invonics_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: invonics_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: invonics_minio
      MINIO_ROOT_PASSWORD: invonics_minio_pass
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
  minio_data_dev:
